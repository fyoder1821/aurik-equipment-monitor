services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=aurik_equipment_monitor
      - POSTGRES_USER=aurik
      - POSTGRES_PASSWORD=aurik
    ports:
      - "5433:5432" # host 5433 -> avoid clashing with a Postgres already running on the host's 5432; the app talks to the container over the internal docker network on 5432 regardless
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurik -d aurik_equipment_monitor"]
      interval: 2s
      timeout: 3s
      retries: 15

  equipment-monitor:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://aurik:aurik@postgres:5432/aurik_equipment_monitor?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
